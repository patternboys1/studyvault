name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build site
        env:
          VITE_PAYSTACK_PUBLIC_KEY: ${{ vars.VITE_PAYSTACK_PUBLIC_KEY || 'pk_test_c46e03248bd2014b3f8627821942614e2d8f72d7' }}
        run: |
          if [[ ! "$VITE_PAYSTACK_PUBLIC_KEY" =~ ^pk_(test|live)_ ]]; then
            echo "::error::A valid Paystack public key is required before deploying."
            exit 1
          fi
          if [[ "$VITE_PAYSTACK_PUBLIC_KEY" =~ ^pk_test_ ]]; then
            echo "::warning::Paystack test mode is active. Transactions will not charge real money."
          fi
          npm run build:github-pages

      - name: Add SPA route fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
